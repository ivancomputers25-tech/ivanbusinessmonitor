<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Settings - IVAN TECH HUB</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="topbar"><div class="topbar-inner"><img src="images/logo.jpg" onerror="this.style.display='none'"><div><h1>IVAN <span>TECH HUB</span></h1><div class="motto">Business Monitor System</div><div class="sub">Yumbe, Uganda</div></div><div class="top-user"><div>Welcome, <b id="userName">Loading...</b></div><span class="role" id="userRole">-</span><button onclick="logout()">Logout</button></div></div></div>
<nav class="menu"><div class="menu-inner"><a href="dashboard.html">Dashboard</a><a href="jobs.html">Jobs</a><a href="customers.html">Customers</a><a href="stock.html">Stock</a><a href="prices.html">Prices</a><a href="expenses.html">Expenses</a><a href="reports.html">Reports</a><a href="settings.html" class="active">Settings</a></div></nav>
<div class="wrap"><div class="breadcrumb">Home / <b>Settings</b></div>
<div class="title-card"><div><h2><i class="fa-solid fa-gear"></i> Settings</h2><p>Manage users & business info</p></div></div>
<div class="card"><div class="card-head"><span>Add User</span></div><div class="card-body"><div class="form-grid three"><div class="field"><label>Full Name</label><input id="uName"></div><div class="field"><label>Username</label><input id="uUser"></div><div class="field"><label>Password</label><input id="uPass"></div><div class="field"><label>Role</label><select id="uRole"><option>ADMIN</option><option>STAFF</option></select></div></div><button class="btn btn-green btn-block" style="margin-top:14px" onclick="addUser()">Add User</button><p id="msg" style="text-align:center;font-size:13px"></p></div></div>
<div class="card"><div class="card-head"><span>All Users</span></div><div class="card-body"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Action</th></tr></thead><tbody id="userTable"></tbody></table></div></div></div>
<div class="card"><div class="card-head"><span>Business Info (Shows on Receipt)</span></div><div class="card-body"><div class="form-grid two"><div class="field"><label>Business Name</label><input id="bName" value="IVAN TECH HUB"></div><div class="field"><label>Phone</label><input id="bPhone" value="0778007451"></div><div class="field"><label>Location</label><input id="bLoc" value="Yumbe, Uganda"></div><div class="field"><label>Motto</label><input id="bMotto" value="Fast, Affordable & Reliable"></div></div><button class="btn btn-gold btn-block" style="margin-top:14px" onclick="saveBusiness()">Save Business Info</button></div></div>
</div><div class="footer"><b>IVAN TECH HUB</b> • © 2026</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://xgadezouciekpsflwxdd.supabase.co"; 
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhnYWRlem91Y2lla3BzZmx3eGRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NTQ0NDksImV4cCI6MjEwOTUzMDQ0OX0.UX6xUYRM_S3xjpf6IfoHko6T7Poz5YKaffX7EE1ldKM";
  const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const user=JSON.parse(localStorage.getItem('ith_user')||'null'); if(!user) location.href='login.html';
if(user){ document.getElementById('userName').textContent=user.full_name||user.username; document.getElementById('userRole').textContent=user.role||'STAFF'; }
function logout(){ localStorage.removeItem('ith_user'); location.href='login.html'; }
async function loadUsers(){ const {data}=await supabaseClient.from('ith_users').select('*').order('created_at',{ascending:false}); document.getElementById('userTable').innerHTML=(data||[]).map(u=>`<tr><td>${u.full_name||''}</td><td>${u.username}</td><td><span class="badge badge-navy">${u.role}</span></td><td><button class="btn btn-red btn-sm" onclick="delUser('${u.id}')">Delete</button></td></tr>`).join(''); }
async function addUser(){ const full_name=document.getElementById('uName').value.trim(), username=document.getElementById('uUser').value.trim(), password=document.getElementById('uPass').value.trim(), role=document.getElementById('uRole').value; if(!full_name||!username||!password) return document.getElementById('msg').textContent='Fill all fields'; const {error}=await supabaseClient.from('ith_users').insert({full_name,username,password,role}); if(error) document.getElementById('msg').textContent=error.message; else { document.getElementById('msg').textContent='User added'; ['uName','uUser','uPass'].forEach(id=>document.getElementById(id).value=''); loadUsers(); } }
async function delUser(id){ if(!confirm('Delete user?')) return; await supabaseClient.from('ith_users').delete().eq('id',id); loadUsers(); }
function saveBusiness(){ localStorage.setItem('ith_business',JSON.stringify({name:document.getElementById('bName').value,phone:document.getElementById('bPhone').value,location:document.getElementById('bLoc').value,motto:document.getElementById('bMotto').value})); alert('Business info saved — will show on receipts'); }
const b=JSON.parse(localStorage.getItem('ith_business')||'null'); if(b){ document.getElementById('bName').value=b.name; document.getElementById('bPhone').value=b.phone; document.getElementById('bLoc').value=b.location; document.getElementById('bMotto').value=b.motto; }
loadUsers();
</script></body></html>
